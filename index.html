const $=id=>document.getElementById(id), N=16;
const lvOf=r=>Math.min(Math.floor((r-1)/100),N-1);
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let lvl=Math.min(Math.max(store.get('cz:lvl',0)|0,0),N-1), chk=new Set(store.get('cz:chk',[])), onlyNew=false, sheetOn=true;
const byLv=Array.from({length:N},(_,i)=>D.filter(w=>lvOf(w[0])===i));
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const cnt=i=>byLv[i].filter(w=>chk.has(w[0])).length;
function chips(){$('chips').innerHTML=byLv.map((l,i)=>`<button class="chip${cnt(i)===l.length?' done':''}" data-i="${i}" ${i===lvl?'aria-current="true"':''} aria-label="レベル${i+1}">${i+1}</button>`).join('')}
function prog(){const l=byLv[lvl],c=cnt(lvl);$('pt').textContent=`LEVEL ${lvl+1}（${l[0][0]}–${l[l.length-1][0]}）`;$('pc').textContent=`${c} / ${l.length} 覚えた`;$('pb').style.width=(c/l.length*100)+'%'}
function render(toTop){
 const rows=byLv[lvl].filter(w=>!onlyNew||!chk.has(w[0])).map(w=>`<div class="row${chk.has(w[0])?' done':''}" data-r="${w[0]}"><button class="chk" aria-label="覚えた">${w[0]}</button><div class="cz"><b>${esc(w[1])}</b><span>${esc(w[3])}</span></div><div class="jp"><b>${esc(w[2])}</b><span>${esc(w[4])}</span></div></div>`).join('');
 $('list').innerHTML=(rows||'<p class="empty">このレベルは全部チェック済みです。</p>')+`<button class="next" id="nx" ${lvl===N-1?'disabled':''}>${lvl===N-1?'最後のレベルです':`LEVEL ${lvl+2} へ進む`}</button>`;
 chips();prog();const a=document.querySelector('.chip[aria-current]');a&&a.scrollIntoView&&a.scrollIntoView({inline:'center',block:'nearest'});
 if(toTop&&window.scrollTo)window.scrollTo(0,0);
}
$('list').addEventListener('click',e=>{
 if(e.target.id==='nx'){setLvl(lvl+1);return}
 const b=e.target.closest('.chk');if(!b)return;const row=b.closest('.row'),r=+row.dataset.r;
 chk.has(r)?chk.delete(r):chk.add(r);store.set('cz:chk',[...chk]);
 if(onlyNew)render();else{row.classList.toggle('done',chk.has(r));chips();prog()}
});
function setLvl(i){lvl=i;store.set('cz:lvl',i);render(true)}
$('chips').addEventListener('click',e=>{const c=e.target.closest('.chip');if(c)setLvl(+c.dataset.i)});
$('bUnchk').onclick=e=>{onlyNew=!onlyNew;e.currentTarget.setAttribute('aria-pressed',onlyNew);render()};
$('hintX').onclick=()=>{$('hint').remove();store.set('cz:hint',1)};
if(store.get('cz:hint',0))$('hint').remove();

/* ---- red sheet ---- */
const F=$('film'),gT=$('gTop'),gM=$('gMove');let sTop=0,sBot=0;const MIN=70;
const hb=()=>document.querySelector('header').getBoundingClientRect().bottom;
function place(){const H=innerHeight,h=hb();sTop=Math.max(h,Math.min(sTop,H-MIN));sBot=Math.max(sTop+MIN,Math.min(sBot,H));sTop=Math.min(sTop,sBot-MIN);
 F.style.top=sTop+'px';F.style.height=(sBot-sTop)+'px';gT.style.top=(sTop+8)+'px';gM.style.top=(sBot-36)+'px';
 const off=!sheetOn;[F,gT,gM].forEach(x=>x.classList.toggle('off',off))}
function initSheet(){const h=hb();sTop=h+4;sBot=h+4+Math.round((innerHeight-h)*.5);place()}
function drag(g,fn){let y0,t0,b0,id=null;
 g.addEventListener('pointerdown',e=>{id=e.pointerId;g.setPointerCapture(id);y0=e.clientY;t0=sTop;b0=sBot;e.preventDefault()});
 g.addEventListener('pointermove',e=>{if(e.pointerId!==id)return;fn(e.clientY-y0,t0,b0);place()});
 const end=e=>{if(e.pointerId===id)id=null};g.addEventListener('pointerup',end);g.addEventListener('pointercancel',end);
 g.addEventListener('keydown',e=>{const d=e.key==='ArrowDown'?20:e.key==='ArrowUp'?-20:0;if(d){fn(d,sTop,sBot);place();e.preventDefault()}})}
drag(gM,(dy,t0,b0)=>{const H=innerHeight,h=hb();dy=Math.max(h-t0,Math.min(dy,H-b0));sTop=t0+dy;sBot=b0+dy});
drag(gT,(dy,t0)=>{sTop=t0+dy});
$('bSheet').onclick=e=>{sheetOn=!sheetOn;e.currentTarget.setAttribute('aria-pressed',sheetOn);place()};
addEventListener('resize',place);
render();initSheet();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0&&window.top===window){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script></body></html>
